<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Marigold & Deep Orange Gradient Base -->
    <linearGradient id="marigold-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="40%" stop-color="#E64A19" />
      <stop offset="100%" stop-color="#8D2600" />
    </linearGradient>

    <!-- Warm Gold Outline Gradient -->
    <linearGradient id="mandala-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Detailed 12-Petal Lotus Ring -->
    <g id="lotus-petal-ring">
      <!-- 12 Radiating Pointed Petals -->
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(30)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(60)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(90)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(120)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(150)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(180)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(210)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(240)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(270)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(300)" />
      <path d="M 0,-210 C 25,-170 35,-120 0,-90 C -35,-120 -25,-170 0,-210 Z" transform="rotate(330)" />
    </g>
  </defs>

  <!-- Canvas Squircle Badge -->
  <rect width="512" height="512" rx="120" fill="url(#marigold-base)" />

  <!-- Outer Frame Ring -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#mandala-gold)" stroke-width="6" opacity="0.6" />

  <!-- Centered Mandala Floral Element -->
  <g transform="translate(256, 256)">
    <!-- Layered Outer Lotus Petals -->
    <use href="#lotus-petal-ring" fill="none" stroke="url(#mandala-gold)" stroke-width="5" opacity="0.75" />
    
    <!-- Offset Inner Petals for Density -->
    <use href="#lotus-petal-ring" fill="none" stroke="url(#mandala-gold)" stroke-width="3.5" opacity="0.5" transform="scale(0.82) rotate(15)" />

    <!-- Concentric Decorative Mandala Rings -->
    <circle r="185" stroke="url(#mandala-gold)" stroke-width="3" fill="none" opacity="0.8" />
    <circle r="125" stroke="url(#mandala-gold)" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.9" />
  </g>

  <!-- Crisp Central Bold Typography -->
  <text 
    x="50%" 
    y="53%" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="220" 
    font-weight="900" 
    letter-spacing="-5" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    dominant-baseline="middle"
    style="text-shadow: 0px 6px 16px rgba(0,0,0,0.5);">DF</text>
</svg>
