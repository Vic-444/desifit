# Rebuilds the site so blog posts whose publishAt has passed become visible.
# Cloudflare Pages builds on push; this empty commit is the scheduled “go live”.
name: Publish scheduled blog

on:
  schedule:
    # Every Saturday 16:10 UTC = 9:40 PM IST (10 min after the Desi Short)
    - cron: "40 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Empty commit to trigger Cloudflare Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild for scheduled blog publish"
          git push origin main
